<form #registerForm="ngForm" (ngSubmit)="onSubmit(registerForm)">
    <div class="min-h-screen w-full flex items-center justify-center px-4 py-2" style="background-color: '#fff9f6';">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-md p-8 border border-[#ddd]">
            <h1 class="text-3xl font-bold mb-2 text-[#ff4d2d]">ZipDish</h1>
            <p class="text-gray-600 mb-8"> Create your account to get started with delicious food deliveries. </p>

            <!-- {{FullName}} --> 
            <div class="mb-4">
                <label for="fullName" class="block text-gray-700 font-medium mb-1">Full Name</label>
                <input type="text" id="fullName" name="fullName" [(ngModel)]="fullName"
                    class="w-full border rounded-lg px-3 py-2 border-[#ddd] focus:outline focus:border-orange-500"
                    placeholder="Enter Full Name..." required>
            </div>

            <!-- {{Email}} -->

            <div class="mb-4">
                <label for="email" class="block text-gray-700 font-medium mb-1">Email</label>
                <input type="email" id="email" name="email" [(ngModel)]="email" required
                    class="w-full border rounded-lg px-3 py-2 border-[#ddd] focus:outline focus:border-orange-500"
                    placeholder="Enter Email...">
            </div>

            <!-- {{Mobile}} -->

            <div class="mb-4">
                <label for="mobile" class="block text-gray-700 font-medium mb-1">Mobile No</label>
                <input type="text" id="mobile" name="mobileNo" [(ngModel)]="mobileNo" required
                    class="w-full border rounded-lg px-3 py-2 border-[#ddd] focus:outline focus:border-orange-500"
                    placeholder="Enter Mobile No...">
            </div>

            <!-- {{Password}} -->

            <div class="mb-4">
                <label for="password" class="block text-gray-700 font-medium mb-1">Password</label>
                <div class="relative">
                    <input [type]="hide()?'text':'password'" id="password" name="password" [(ngModel)]="password"
                        class="w-full border rounded-lg px-3 py-2 border-[#ddd] focus:outline focus:border-orange-500"
                        placeholder="Enter Password..." required>
                    <mat-icon class="absolute right-3 top-2 " (click)="togglePassword($event)" matSuffix>
                        {{hide() ? 'visibility_off' : 'visibility'}}
                    </mat-icon>
                </div>
            </div>

            <div class="mb-4">
                <label for="role" class="block text-gray-700 font-medium mb-1">Role</label>
                <div class="flex gap-2">
                    @for (role of roles; track role) {
                    <button (click)="selectRole(role)" type="button" class="flex-1 border rounded-lg px-3 py-2 font-medium transition-colors cursor-pointer text-[#ff4d2d]"
                        [class.bg-orange-500]="selectedRole === role" [class.text-white]="selectedRole === role">
                        {{role}}
                    </button>
                    }
                </div>
            </div>
            <button type="submit"  class="w-full font-semibold py-2 mb-4 rounded-lg border transition duration-200 bg-[#ff4d2d] text-white hover:bg-[#e64323] cursor-pointer"> Sign Up </button>

            <div (click)="googleLogin()" class="flex items-center justify-center gap-4 border border-gray-400 rounded-lg py-2 hover:bg-gray-100 transition duration-200 cursor-pointer">
                <img src="../../assets/google.png" class="h-5 w-5 " alt="Google">
                <p class="">Sign up with Google</p>
            </div>
            <p class="mt-6 text-center">Already have an account? <span class="text-[#ff4d2d] cursor-pointer" [routerLink]="'/login'">Login</span></p>
        </div>
    </div>
</form>
