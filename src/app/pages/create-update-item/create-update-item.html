<div
    class="flex flex-col items-center justify-center p-6 bg-linear-to-r from-orange-100 to-white relative min-h-screen">
    <div class="absolute top-5 left-5 z-10 mb-2.5 cursor-pointer">
        <mat-icon [routerLink]="'/homepage'"
            style="color: #ff4d2d; height: 30px; width: 30px; font-size: 30px;">arrow_back_ios</mat-icon>
    </div>

    <div class="max-w-lg w-full bg-white shadow-xl rounded-2xl p-8 border border-orange-300">
        <div class=" flex flex-col items-center ">
            <div class="bg-orange-100 p-4 rounded-full mb-4 w-20 h-20">
                <mat-icon style="font-size: 50px; height: 50px; width: 50px; color: #ff4d2d;"
                    class="mb-4 text-[50px] text-[#ff4d2d]">
                    restaurant
                </mat-icon>
            </div>

            <div class="text-xl font-extrabold text-gray-900">
                @if (isEditMode) {
                Edit Item
                }@else {
                Add Item
                }
            </div>
        </div>

        <form class="space-y-5" #itemForm="ngForm" (ngSubmit)="onSubmit(itemForm)">
            <div>
                <label for="name" class="block text-gray-700 font-medium mb-1">Name</label>
                <input type="text" id="name" name="name" [(ngModel)]="name"
                    class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:border-orange-500"
                    placeholder="Enter Item Name..." required>
            </div>

            <div>
                <label for="image" class="block text-gray-700 font-medium mb-1">Food Image</label>
                <input type="file" (change)="onFileSelected($event)" accept='image/*' id="image" name="image"
                    class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:border-orange-500"
                    placeholder="Please Select Image" required>
                @if (imagePreview) {
                <div class="mt-4 ">
                    <img [src]="imagePreview" alt="Shop Image" class="w-full h-48 object-cover rounded-lg border">
                </div>
                }
            </div>

            <div>
                <label for="price" class="block text-gray-700 font-medium mb-1">Price</label>
                <input type="number" id="price" name="price" [(ngModel)]="price"
                    class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:border-orange-500"
                    placeholder="0.00" required>
            </div>

            <div>
                <label for="category" class="block text-gray-700 font-medium mb-1">Category</label>
                <select name="category" id="category" [(ngModel)]="selectedCategory" required=""
                    class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:border-orange-500">

                    <option value="" disabled selected>
                        Select Category
                    </option>

                    @for (item of category; track item) {
                    <option [value]="item"> {{item}} </option>
                    }

                </select>
            </div>

            <div>
                <label for="foodtype" class="block text-gray-700 font-medium mb-1">
                    Food Type
                </label>

                <select name="foodtype" id="foodtype" [(ngModel)]="selectedFoodType" required
                    class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:border-orange-500">

                    <option value="" disabled>
                        Select Food Type
                    </option>

                    @for (item of foodtype; track item) {
                    <option [value]="item">
                        {{ item }}
                    </option>
                    }

                </select>
            </div>

            <button type="submit"
                class="w-full bg-[#ff4d2d] text-white px-6 py-3 rounded-lg font-semibold shadow-md hover:bg-orange-600 hover:shadow-lg transition-all duration-200 cursor-pointer">
                @if (isEditMode) {
                Update Item
                }@else {
                Create Item 
                }
            </button>

        </form>
    </div>
</div>
